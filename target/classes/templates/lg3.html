<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Virtual — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 60% 40%, #0a2060 0%, #040e2e 55%, #020818 100%);
      position: relative;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 10;
      background-color: #ffffff;
      border-radius: 16px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      margin: 24px;
      box-shadow: 0 32px 80px rgba(3,14,46,0.55), 0 8px 24px rgba(3,14,46,0.3);
      border-top: 4px solid #03143a;
    }

    .brand {
      text-align: center;
      margin-bottom: 36px;
    }

    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 60px;
      border-radius: 14px;
      background-color: #03143a;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(3,20,58,0.35);
    }

    .brand h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      color: #03143a;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .brand p {
      font-size: 14px;
      color: #5a6a82;
    }

    .blue-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(3,20,58,0.33), transparent);
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1a2540;
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }

    .field      { margin-bottom: 18px; }
    .field-pass { margin-bottom: 10px; }
    .input-wrap { position: relative; }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0d8e8;
      border-radius: 10px;
      font-size: 14.5px;
      color: #0d1b2a;
      background-color: #f7f9fc;
      outline: none;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    input[type="password"],
    input[type="text"] { padding-right: 42px; }

    input:focus {
      border-color: #03143a;
      box-shadow: 0 0 0 3px rgba(3,20,58,0.10);
      background-color: #ffffff;
    }

    .toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #8496b0;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .forgot-wrap { text-align: right; margin-bottom: 28px; }

    .link-blue {
      font-size: 13px;
      color: #1a4bbd;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .link-blue:hover { color: #03143a; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background-color: #03143a;
      color: #c9a84c;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.3px;
      transition: background-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(3,20,58,0.30);
    }
    .btn-login:hover:not(:disabled) { background-color: #0a2a6e; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 28px 0;
    }
    .divider-line { flex: 1; height: 1px; background-color: #e2e8f0; }
    .divider span { font-size: 12px; color: #94a3b8; font-weight: 500; }

    .register-text { text-align: center; font-size: 14px; color: #5a6a82; }

    .link-blue-bold {
      color: #1a4bbd;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .link-blue-bold:hover { color: #03143a; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .spinner { animation: spin 0.9s linear infinite; }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; }
    }
  </style>
</head>
<body>

  <canvas id="starCanvas"></canvas>

  <div class="card">
    <div class="brand">
      <div class="icon-wrap">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="M4 19.5A2.5 2.5 0 016.5 17H20" stroke="#c9a84c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z" stroke="#c9a84c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Biblioteca Virtual</h1>
      <p>Acesse sua conta para continuar</p>
    </div>

    <div class="blue-divider"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required />
      </div>

      <div class="field-pass">
        <label for="password">Senha</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" required />
          <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="Mostrar senha">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot-wrap">
        <a href="#" class="link-blue">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Entrar na Biblioteca
      </button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span>ou</span>
      <div class="divider-line"></div>
    </div>

    <p class="register-text">
      Não tem uma conta?
      <a href="#" class="link-blue-bold">Cadastre-se gratuitamente</a>
    </p>
  </div>

  <script>
    /* ── ESTRELAS ── */

    var STAR_COUNT = 220;
    var stars = [];

    for (var i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x:            Math.random() * 100,          // posição em % da tela
        y:            Math.random() * 100,
        r:            Math.random() * 1.6 + 0.4,    // raio entre 0.4 e 2px
        opacity:      Math.random() * 0.5 + 0.4,    // opacidade base
        gold:         Math.random() < 0.18,          // 18% são douradas
        twinkleSpeed: Math.random() * 2 + 1.5,       // velocidade do piscar
        twinkleOffset:Math.random() * Math.PI * 2    // fase inicial aleatória
      });
    }

    var canvas = document.getElementById('starCanvas');
    var ctx    = canvas.getContext('2d');

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function draw(timestamp) {
      var t = timestamp || 0;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];

        // seno cria o efeito de piscar suave
        var twinkle = Math.sin((t / 1000) * s.twinkleSpeed + s.twinkleOffset);
        var alpha   = s.opacity + twinkle * 0.25;
        alpha = Math.max(0, Math.min(1, alpha));

        var px = (s.x / 100) * canvas.width;
        var py = (s.y / 100) * canvas.height;

        ctx.beginPath();
        ctx.arc(px, py, s.r, 0, Math.PI * 2);
        ctx.fillStyle = s.gold
          ? 'rgba(220, 185, 100, ' + alpha + ')'
          : 'rgba(255, 255, 255, ' + alpha + ')';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);

    /* ── LOGIN ── */

    var passwordVisible = false;

    function togglePassword() {
      passwordVisible = !passwordVisible;
      var input = document.getElementById('password');
      var icon  = document.getElementById('eye-icon');
      input.type = passwordVisible ? 'text' : 'password';
      icon.innerHTML = passwordVisible
        ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M1 1l22 22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
    }

    function handleLogin(e) {
      e.preventDefault();
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<svg class="spinner" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="rgba(201,168,76,0.3)" stroke-width="3"/><path d="M12 2a10 10 0 0110 10" stroke="#c9a84c" stroke-width="3" stroke-linecap="round"/></svg> Entrando...';
      setTimeout(function() {
        btn.disabled = false;
        btn.innerHTML = 'Entrar na Biblioteca';
      }, 1800);
    }
  </script>

</body>
</html>
