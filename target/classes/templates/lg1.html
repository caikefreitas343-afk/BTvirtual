<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Bibliotheca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* ── Painel esquerdo ── */
    .panel-left {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
      min-width: 520px;
      width: 52%;
      flex-shrink: 0;
      background: linear-gradient(160deg, #0d1b3e 0%, #091530 60%, #060e22 100%);
    }

    @media (min-width: 1024px) {
      .panel-left { display: flex; }
    }

    .panel-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 40% 35%, rgba(30,58,110,0.5) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Wordmark */
    .wordmark {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wordmark-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(201,168,76,0.15);
      border: 1px solid rgba(201,168,76,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wordmark span {
      font-family: 'Lora', serif;
      font-weight: 500;
      font-size: 1.125rem;
      color: #ffffff;
      letter-spacing: 0.04em;
    }

    /* Centro */
    .panel-center {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .panel-center h1 {
      font-family: 'Lora', serif;
      font-size: clamp(1.75rem, 2.5vw, 2.25rem);
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .panel-center h1 em {
      color: #c9a84c;
      font-style: italic;
    }

    .panel-center p {
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
      font-weight: 300;
      line-height: 1.6;
      text-align: center;
      max-width: 280px;
    }

    /* Stats */
    .stats {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 32px;
    }

    .stat-value {
      font-family: 'Lora', serif;
      font-size: 1.125rem;
      font-weight: 600;
      color: #c9a84c;
    }

    .stat-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.4);
      margin-top: 2px;
    }

    /* ── Painel direito ── */
    .panel-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      padding: 48px 24px;
      min-height: 100vh;
    }

    .mobile-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 40px;
    }

    .mobile-logo span {
      font-family: 'Lora', serif;
      font-weight: 500;
      font-size: 1.125rem;
      color: #0f204d;
    }

    @media (min-width: 1024px) {
      .mobile-logo { display: none; }
    }

    .form-wrapper {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* Heading */
    .form-heading h2 {
      font-family: 'Lora', serif;
      font-size: 1.875rem;
      font-weight: 600;
      color: #111111;
      letter-spacing: -0.02em;
    }

    .form-heading p {
      font-size: 0.875rem;
      color: #6b7a9e;
      margin-top: 6px;
    }

    /* Form */
    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.7rem;
      font-weight: 500;
      color: #0d1b3e;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f4f6fb;
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 0 16px;
      height: 48px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: #0d1b3e;
    }

    .input-wrap input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.875rem;
      color: #111111;
    }

    .input-wrap input::placeholder {
      color: #b0bbd9;
    }

    .input-icon {
      flex-shrink: 0;
      color: #6b7a9e;
    }

    /* Toggle senha */
    .toggle-pass {
      background: none;
      border: none;
      cursor: pointer;
      color: #6b7a9e;
      padding: 0;
      display: flex;
      align-items: center;
      transition: opacity 0.15s;
    }

    .toggle-pass:hover { opacity: 0.6; }

    /* Row lembrar + esqueceu */
    .row-remember {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      font-size: 0.875rem;
      color: #0d1b3e;
    }

    .remember-label input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid #b0bbd9;
      border-radius: 4px;
      background: #f4f6fb;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    .remember-label input[type="checkbox"]:checked {
      background: #0d1b3e;
      border-color: #0d1b3e;
    }

    .remember-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 6px;
      height: 10px;
      border: 2px solid #ffffff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .forgot-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: #c9a84c;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .forgot-link:hover { opacity: 0.65; }

    /* Botão submit */
    .btn-submit {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0e1d42 0%, #1a2f5e 100%);
      box-shadow: 0 4px 16px rgba(13,27,62,0.3);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-submit:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Divisor */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(13,27,62,0.1);
    }

    .divider span {
      font-size: 0.75rem;
      color: #b0bbd9;
    }

    /* Cadastro */
    .register-row {
      text-align: center;
      font-size: 0.875rem;
      color: #6b7a9e;
    }

    .register-row a {
      font-weight: 500;
      color: #11224d;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .register-row a:hover { opacity: 0.6; }

    /* SVG ilustração */
    .illustration {
      width: 100%;
      max-width: 300px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <!-- Painel esquerdo -->
  <div class="panel-left">

    <div class="wordmark">
      <div class="wordmark-icon">
        <!-- ícone livro -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      </div>
      <span>Bibliotheca</span>
    </div>

    <div class="panel-center">
      <!-- Ilustração de livros -->
      <svg class="illustration" viewBox="0 0 320 280" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="210" width="220" height="34" rx="4" fill="#1e3a6e"/>
        <rect x="40" y="210" width="18" height="34" rx="2" fill="#2a4f8a"/>
        <rect x="72" y="218" width="80" height="4" rx="2" fill="rgba(201,168,76,0.5)"/>
        <rect x="72" y="228" width="52" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
        <rect x="55" y="172" width="200" height="40" rx="4" fill="#162f5c"/>
        <rect x="55" y="172" width="18" height="40" rx="2" fill="#1e3f7a"/>
        <rect x="88" y="182" width="96" height="4" rx="2" fill="rgba(201,168,76,0.6)"/>
        <rect x="88" y="194" width="64" height="3" rx="1.5" fill="rgba(255,255,255,0.18)"/>
        <rect x="88" y="201" width="44" height="3" rx="1.5" fill="rgba(255,255,255,0.10)"/>
        <rect x="70" y="128" width="180" height="46" rx="4" fill="#0a1e48"/>
        <rect x="70" y="128" width="20" height="46" rx="2" fill="#142a60"/>
        <rect x="106" y="140" width="110" height="5" rx="2.5" fill="rgba(201,168,76,0.75)"/>
        <rect x="106" y="152" width="76" height="3.5" rx="1.75" fill="rgba(255,255,255,0.2)"/>
        <rect x="106" y="160" width="54" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
        <g transform="translate(80,56)">
          <path d="M80 0 C60 4 20 8 0 12 L0 72 C20 68 60 64 80 60 Z" fill="#f8f9ff"/>
          <path d="M80 0 C100 4 140 8 160 12 L160 72 C140 68 100 64 80 60 Z" fill="#eef1f8"/>
          <line x1="80" y1="0" x2="80" y2="60" stroke="rgba(13,27,62,0.25)" stroke-width="2"/>
          <line x1="16" y1="26" x2="72" y2="22" stroke="rgba(13,27,62,0.12)" stroke-width="1.5"/>
          <line x1="16" y1="34" x2="72" y2="30" stroke="rgba(13,27,62,0.12)" stroke-width="1.5"/>
          <line x1="16" y1="42" x2="72" y2="38" stroke="rgba(13,27,62,0.12)" stroke-width="1.5"/>
          <line x1="88" y1="22" x2="144" y2="26" stroke="rgba(13,27,62,0.12)" stroke-width="1.5"/>
          <line x1="88" y1="30" x2="144" y2="34" stroke="rgba(13,27,62,0.12)" stroke-width="1.5"/>
          <line x1="88" y1="38" x2="144" y2="42" stroke="rgba(13,27,62,0.12)" stroke-width="1.5"/>
          <path d="M-4 10 C-6 6 -8 4 -10 4 L-10 76 C-8 76 -6 74 -4 70 Z" fill="#1e3a6e"/>
          <path d="M164 10 C166 6 168 4 170 4 L170 76 C168 76 166 74 164 70 Z" fill="#1e3a6e"/>
        </g>
        <circle cx="30" cy="90" r="3" fill="rgba(201,168,76,0.4)"/>
        <circle cx="290" cy="140" r="2" fill="rgba(201,168,76,0.35)"/>
        <circle cx="18" cy="160" r="2.5" fill="rgba(255,255,255,0.15)"/>
        <circle cx="300" cy="200" r="3.5" fill="rgba(255,255,255,0.1)"/>
      </svg>

      <div>
        <h1>Conhecimento ao<br><em>alcance das mãos</em></h1>
        <p style="margin-top:16px">Milhares de títulos, periódicos e obras raras reunidos em um só lugar.</p>
      </div>
    </div>

    <div class="stats">
      <div>
        <div class="stat-value">48 mil</div>
        <div class="stat-label">Títulos</div>
      </div>
      <div>
        <div class="stat-value">320</div>
        <div class="stat-label">Periódicos</div>
      </div>
      <div>
        <div class="stat-value">24/7</div>
        <div class="stat-label">Disponível</div>
      </div>
    </div>

  </div>

  <!-- Painel direito -->
  <div class="panel-right">

    <div class="mobile-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0d1b3e" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
      <span>Biblioteca</span>
    </div>

    <div class="form-wrapper">

      <div class="form-heading">
        <h2>Entrar</h2>
        <p>Acesse sua conta para continuar lendo.</p>
      </div>

      <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="field">
          <label for="email">E-mail</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="email" name="username" placeholder="seu@email.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pass" onclick="toggleSenha(this)" aria-label="Mostrar senha">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row-remember">
          <label class="remember-label">
            <input type="checkbox" name="remember-me" />
            Lembrar de mim
          </label>
          <a href="/esqueceu-senha" class="forgot-link">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-submit">Entrar na Biblioteca</button>
      </form>

      <div class="divider">
        <div class="divider-line"></div>
        <span>ou</span>
        <div class="divider-line"></div>
      </div>

      <div class="register-row">
        Ainda não tem conta? <a href="/cadastro">Cadastre-se gratuitamente</a>
      </div>

    </div>
  </div>

  <script>
    function toggleSenha(btn) {
      const input = btn.closest('.input-wrap').querySelector('input');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>

</body>
</html>
