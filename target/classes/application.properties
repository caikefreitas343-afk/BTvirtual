# ===============================================
# CONFIGURAÇÃO GERAL DA APLICAÇÃO
# ===============================================
spring.application.name=LibraryVirtual
server.port=8080

# ===============================================
# CONFIGURAÇÃO DO BANCO DE DADOS MYSQL
# ===============================================
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false
spring.datasource.username=root
spring.datasource.password=SUA_SENHA_AQUI
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ===============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================================
# CONFIGURAÇÃO DO THYMELEAF (Telas HTML)
# ===============================================
# Desativa o cache do Thymeleaf para que alterações nas páginas HTML apareçam sem precisar reiniciar a aplicação
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8