<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/stylelogin.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@1,300&display=swap" rel="stylesheet">
    <title>Login Biblioteca Virtual</title>
</head>
<body>
    <main>
        <div class="container">
            
            <div class="welcome">
                <h1>Bem-Vindo a Biblioteca Virtual!</h1>
                <p class="cadastro">Faça login para acessar o acervo</p>
            </div>

            <div class="panel">
                <div class="mini-container">
                    <p>E-mail</p>
                    <label><input type="email" required></label>
                    <p>Senha</p>
                    <label><input type="password" required></label>
                </div>

                <div class="remember">
                    <label>
                        <input type="checkbox" name="lembrar">
                        Lembre de mim
                    </label>
                </div>

                <button type="submit">Entrar</button> 
                <p>Ainda não possui cadastro? <a href="Cadastro.html">Cadastre-se</a></p>
            </div>
            
        </div>
        
    </main>
</body>
</html>
