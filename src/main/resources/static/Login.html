<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

    <main class="login-container">

        <section class="left-panel">

            <svg class="decor-bg" viewBox="0 0 500 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true">

                <path d="M250 0 H500 V130 Z" fill="#4b3394" opacity="0.7"/>             <!-- triângulo escuro, canto superior direito -->
                <ellipse cx="265" cy="340" rx="145" ry="190" fill="#4b3394" opacity="0.35"/> <!-- mancha escura central, atrás do texto -->
                <ellipse cx="440" cy="480" rx="120" ry="150" fill="#9b78dc" opacity="0.35"/> <!-- mancha clara, canto inferior direito -->
                <circle cx="0" cy="40" r="130" fill="#4b3394" opacity="0.55"/>            <!-- mancha escura, canto superior esquerdo -->


                <defs>
                    <path id="topo" d="M0,-60 C40,-70 80,-30 70,10 C60,50 20,80 -30,60 C-70,45 -80,0 -55,-30 C-40,-48 -20,-55 0,-60 Z"/>
                </defs>


                <g transform="translate(45 70)" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9">
                    <use href="#topo" transform="scale(1.9)"/>
                    <use href="#topo" transform="scale(1.45)"/>
                    <use href="#topo" transform="scale(1.0)"/>
                    <use href="#topo" transform="scale(0.55)"/>
                </g>


                <g transform="translate(450 540)" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9">
                    <use href="#topo" transform="scale(1.6)"/>
                    <use href="#topo" transform="scale(1.25)"/>
                    <use href="#topo" transform="scale(0.9)"/>
                    <use href="#topo" transform="scale(0.55)"/>
                    <use href="#topo" transform="scale(0.25)"/>
                </g>
            </svg>


            <div class="dots" aria-hidden="true"></div>

            <span class="decor-symbol plus plus-1" aria-hidden="true"></span>
            <span class="decor-symbol plus plus-2" aria-hidden="true"></span>
            <span class="decor-symbol circle circle-1" aria-hidden="true"></span>
            <span class="decor-symbol circle circle-2" aria-hidden="true"></span>

            <div class="welcome-box">
                <h1>Bem-vindo a Biblioteca Virtual!</h1>
                <p>Você pode entrar para acessar sua conta existente.</p>
            </div>
        </section>

        <section class="right-panel">
            <h2>Entrar</h2>

            <form class="login-form" id="loginForm" method="post" action="/login">

                <label class="input-box">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/>
                    </svg>
                    <input type="text" name="usuario" placeholder="Usuário ou e-mail" autocomplete="username" required>
                </label>


                <label class="input-box">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2Zm-8-2a3 3 0 0 1 6 0v2H9V7Z"/>
                    </svg>
                    <input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required>
                </label>

                <div class="options">
                    <label class="checkbox-container">
                        <input type="checkbox" name="lembrar" checked>
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#">Esqueci a senha</a>
                </div>

                <button type="submit" class="btn-signin">Entrar</button>

                <p class="footer-text">Novo por aqui? <a href="Cadastro.html">Criar uma conta</a></p>
            </form>
        </section>

    </main>
</body>
</html>
