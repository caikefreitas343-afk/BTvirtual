<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Virtual - Bibliotecário</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column;
               align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f4f1fb; }
        h1 { color: #4b3394; }
        button { padding: 10px 24px; border: 0; border-radius: 999px; background: #6a4bc4; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <!-- TELA PROVISÓRIA: troque pelo painel real (cadastrar livros, multas...) -->
    <h1>Olá, <span id="nome"></span>!</h1>
    <p>Login de bibliotecário funcionando. Aqui vai ficar o painel de livros e multas.</p>
    <button onclick="sair()">Sair</button>

    <script>
        const usuario = JSON.parse(sessionStorage.getItem('usuario') || 'null');
        if (!usuario || usuario.tipoUsuario !== 'BIBLIOTECARIO') {
            window.location.href = '/Login.html';
        } else {
            document.getElementById('nome').textContent = usuario.nome;
        }

        function sair() {
            sessionStorage.removeItem('usuario');
            window.location.href = '/Login.html';
        }
    </script>
</body>
</html>
