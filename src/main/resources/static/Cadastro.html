<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/stylecadastro.css">
    <title>Cadastro</title>
</head>
<body>
    <main>
        <form>
            <div class="container">
                <h2>Cadastro</h2>
                <div class="panel">
                    <p>Nome de Usuário</p>
                    <label><input type="text" required></label>
                    <p>E-mail</p>
                    <label><input type="email"></label>
                    <p>Senha</p>
                    <label><input type="password"></label>
                    <br></br>
                    <button type="submit">Cadastrar-se</button>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
